name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run verification test suite
        run: flutter test

      - name: Build Universal Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Split-per-ABI Release APKs
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Organize Release Artifacts
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/Royal-Spend-v2.0.0-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/Royal-Spend-v2.0.0-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-assets/Royal-Spend-v2.0.0-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-assets/Royal-Spend-v2.0.0-x86_64.apk

      - name: Create GitHub Release & Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          name: Royal Spend ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*.apk
